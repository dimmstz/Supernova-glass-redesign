name: Android CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  ANDROID_PLATFORM: 'android-36'
  ANDROID_BUILD_TOOLS: '35.0.0'

jobs:
  build-debug:
    name: Build debug APK
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;${{ env.ANDROID_PLATFORM }} build-tools;${{ env.ANDROID_BUILD_TOOLS }}"
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace assembleSafeDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: supernova-debug-${{ github.sha }}
          path: app/build/outputs/apk/safe/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  build-release:
    name: Build and publish release APK
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;${{ env.ANDROID_PLATFORM }} build-tools;${{ env.ANDROID_BUILD_TOOLS }}"
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew --no-daemon --stacktrace assembleSafeRelease

      - name: Sign release APK for CI distribution
        env:
          LUMI_KEYSTORE_B64: ${{ secrets.LUMI_RELEASE_KEYSTORE_BASE64 }}
          LUMI_STORE_PASSWORD: ${{ secrets.LUMI_RELEASE_STORE_PASSWORD }}
          LUMI_KEY_ALIAS: ${{ secrets.LUMI_RELEASE_KEY_ALIAS }}
          LUMI_KEY_PASSWORD: ${{ secrets.LUMI_RELEASE_KEY_PASSWORD }}
        run: |
          # A new key on every run makes Android reject an update as a
          # different app. Release signing must therefore use the same
          # long-lived repository secrets on every tag.
          if [ -n "$LUMI_KEYSTORE_B64" ] && [ -n "$LUMI_STORE_PASSWORD" ] && [ -n "$LUMI_KEY_ALIAS" ] && [ -n "$LUMI_KEY_PASSWORD" ]; then
            printf '%s' "$LUMI_KEYSTORE_B64" | base64 --decode > ci-release.jks
            store_password="$LUMI_STORE_PASSWORD"
            key_alias="$LUMI_KEY_ALIAS"
            key_password="$LUMI_KEY_PASSWORD"
          else
            echo "::error::Persistent release signing secrets are missing. Refusing to publish an APK with a new key because it cannot update the installed Lumi Lite app."
            exit 1
          fi
          unsigned_apk=$(find app/build/outputs/apk/safe/release -maxdepth 1 -name '*unsigned.apk' -print -quit)
          test -n "$unsigned_apk"
          badging=$("$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/aapt" dump badging "$unsigned_apk")
          echo "$badging" | grep -Fq "package: name='com.dimm.lumilite'"
          expected_version=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -1)
          expected_name=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          echo "$badging" | grep -Fq "versionCode='$expected_version'"
          echo "$badging" | grep -Fq "versionName='$expected_name'"
          "$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/apksigner" sign \
            --ks ci-release.jks \
            --ks-key-alias "$key_alias" \
            --ks-pass "pass:$store_password" \
            --key-pass "pass:$key_password" \
            --out "LumiLite-${GITHUB_REF_NAME}.apk" \
            "$unsigned_apk"
          "$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/apksigner" verify --verbose "LumiLite-${GITHUB_REF_NAME}.apk"

      - name: Rename APK
        run: test -s "LumiLite-${GITHUB_REF_NAME}.apk"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: supernova-${{ github.ref_name }}
          path: LumiLite-${{ github.ref_name }}.apk
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: LumiLite-${{ github.ref_name }}.apk
